/* Pulsante indietro per l'app su telefono */
.vertex-back{position:fixed;z-index:9999;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#e8c075;color:#14100a;border:2px solid #70552e;border-radius:12px;padding:13px 18px;font:700 16px Arial,sans-serif;text-decoration:none;box-shadow:0 5px 20px #000b;touch-action:manipulation}
.vertex-back:focus-visible{outline:3px solid white}
@media(min-width:900px){.vertex-back{display:none}}

/* Layout cliente: offerte in primo piano, appuntamenti laterali compatti. */
.body{grid-template-columns:minmax(220px,25%) minmax(0,75%);gap:1.25vw}
.panel{padding:1.5vw;overflow:hidden}
.panel:first-child{padding:1.25vw}
.panel:first-child .heading{font-size:clamp(16px,1.65vw,32px);line-height:1.15;margin:0 0 1.2vh}
.panel:last-child .heading{font-size:clamp(22px,2.7vw,53px);margin:0 0 .8vh}
.rows{gap:.8vh;margin-top:.4vh;overflow-y:auto;min-height:0}
.appointment{grid-template-columns:auto minmax(0,1fr);gap:.75vw;padding:1vh .8vw;border-radius:10px}
.appointment .at{font-size:clamp(17px,1.8vw,36px)}
.appointment .code{font-size:clamp(15px,1.45vw,29px);overflow-wrap:anywhere}
.panel:first-child .hint{font-size:clamp(13px,1.05vw,20px)}
.offer{gap:1.6vh}
.offer-kicker{font-size:clamp(19px,2vw,40px)}
.offer-title{font-size:clamp(42px,5.6vw,115px);line-height:1.07}
.offer-detail{font-size:clamp(23px,2.5vw,52px)}
@media(max-aspect-ratio:1){
 .body{grid-template-columns:1fr;grid-template-rows:minmax(0,23%) minmax(0,77%);gap:1vh}
 .panel:first-child{padding:1vh 2vw}
 .panel:first-child .heading{font-size:clamp(15px,2.2vh,28px);margin-bottom:.3vh}
 .rows{display:flex;flex-direction:row;overflow-x:auto;gap:1vw;margin-top:0}
 .appointment{flex:0 0 auto;min-width:130px;gap:1vw;padding:.5vh 1vw}
 .appointment .at{font-size:2vh}
 .appointment .code{font-size:1.8vh}
 .panel:last-child .heading{font-size:2.7vh}
 .offer-title{font-size:clamp(34px,5vh,85px)}
 .offer-detail{font-size:clamp(18px,2.5vh,38px)}
}
/* Mantieni il dominio leggibile su una sola riga, senza tagli */
.offer-title{max-width:100%;min-width:0}
.offer-title.is-website{white-space:nowrap;overflow-wrap:normal;word-break:normal;letter-spacing:-.025em}

/* Comando discreto per il monitor clienti */
.fullscreen-btn{position:fixed;right:1.5vw;top:1.1vh;z-index:50;background:#211b11;color:#f4d28f;border:1px solid #8d713e;border-radius:8px;font:700 clamp(11px,.9vw,16px) Arial,sans-serif;padding:7px 10px;cursor:pointer;opacity:.8}
.fullscreen-btn:hover,.fullscreen-btn:focus-visible{opacity:1}
.fullscreen-btn:focus-visible{outline:2px solid white}
@media(max-width:899px){.fullscreen-btn{top:auto;bottom:calc(15px + env(safe-area-inset-bottom,0px));right:12px}}

/* VERTEX HAMMAMI - Modern Premium visual restyling (display only) */

<body><button type="button" id="fullscreenBtn" class="fullscreen-btn" aria-label="Attiva schermo intero">⛶ Schermo intero</button><a class="vertex-back" href="/index.html?view=settings" aria-label="Torna all’Admin">← Torna all’Admin</a><div class="screen"><header class="head"><div class="brand">✂ VERTEX HAMMAMI <small>BENVENUTI NEL NOSTRO BARBER SHOP</small></div><div class="time"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></header><main class="body"><section class="panel"><h2 class="heading">APPUNTAMENTI DI OGGI</h2><div class="rows" id="appointments"></div></section><section class="panel"><h2 class="heading">NOVITÀ &amp; OFFERTE</h2><div id="offer" class="offer" aria-live="polite"></div></section></main><footer class="footer"><span>Via Terraglio 111 · Frescada, Preganziol</span><span>PRENOTA SU www.vertexhammami.it</span></footer></div>
<script>
'use strict';
// Pagina autenticata. Deve essere ospitata sullo STESSO dominio dell'Admin.
// Nessun numero di telefono viene mostrato o salvato in questa pagina.
const SB_URL='https://xdyrujptrggyhltljmlm.supabase.co';
const SB_KEY='sb_publishable_PJLP34HkqWKZbwhsN65KKA_12wdK7V8';
const SESSION_KEY='vertex_royal_gold_auth_v1';
const DISPLAY_KEY='vertex_schermo_live_settings_v1';
const DEFAULT_OFFERS=[
 {tag:'BENVENUTI',title:'VERTEX HAMMAMI',detail:'Il tuo stile, la nostra passione.'},
 {tag:'PRENOTA ONLINE',title:'WWW.VERTEXHAMMAMI.IT',detail:'Prenota il tuo appuntamento online.'},
 {tag:'NOVITÀ',title:'LE NOSTRE OFFERTE',detail:'Chiedi in negozio le promozioni disponibili.'}
];
const $=id=>document.getElementById(id);
function settings(){try{const x=JSON.parse(localStorage.getItem(DISPLAY_KEY)||'null');if(x&&Array.isArray(x.offers))return x}catch{}return {offers:DEFAULT_OFFERS,consents:{}}}
function romeParts(value){let o={};for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value))){if(x.type!=='literal')o[x.type]=x.value}return {date:`${o.year}-${o.month}-${o.day}`,hour:`${o.hour}:${o.minute}`,short:`${o.day}/${o.month}`}}
function today(){return romeParts(Date.now()).date}
function bookingCode(id){let h=2166136261;for(const c of String(id)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'A'+String((h>>>0)%10000).padStart(4,'0')}
function bookingName(raw){const first=String(raw||'').trim().split(/\s+/)[0]||'';return first.replace(/[^\p{L}'-]/gu,'').slice(0,26)}
function isBlock(b){return b.status==='blocked'||String(b.customer_name||'').trim().toUpperCase()==='BLOCCATO'||/^pausa(?:\b|\s|·)/i.test(b.service_name||'')}
function session(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');return s?.refresh_token?s:null}catch{return null}}
async function token(){let s=session();if(!s)throw Error('Accedi prima all’Admin in questo browser.');if(Number(s.expires_at||0)>Date.now()+90000&&s.access_token)return s.access_token;
 const res=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});
 const x=await res.json();if(!res.ok||!x.access_token)throw Error('Sessione scaduta: effettua di nuovo il login nell’Admin.');
 s={access_token:x.access_token,refresh_token:x.refresh_token,expires_at:Date.now()+Number(x.expires_in||3600)*1000};localStorage.setItem(SESSION_KEY,JSON.stringify(s));return s.access_token}
async function fetchBookings(){const access=await token();const res=await fetch(SB_URL+'/functions/v1/admin-bookings',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+access},body:JSON.stringify({action:'list'}),cache:'no-store'});const body=await res.json().catch(()=>({}));if(!res.ok||body?.error)throw Error('Accesso ai dati non disponibile. Riapri l’Admin.');const rows=Array.isArray(body)?body:Array.isArray(body.bookings)?body.bookings:body.data;if(!Array.isArray(rows))throw Error('Risposta prenotazioni non valida');return rows}
let bookings=[],slide=0,busy=false;
function draw(){const opt=settings();const d=today();let current=bookings.filter(x=>x.status==='confirmed'&&!isBlock(x)&&x.starts_at&&romeParts(x.starts_at).date===d).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).slice(0);
 const root=$('appointments');root.replaceChildren();for(const b of current){const row=document.createElement('div');row.className='appointment';const when=romeParts(b.starts_at);const at=document.createElement('div');at.className='at';at.textContent=when.hour;const code=document.createElement('div');code.className='code';code.textContent=bookingCode(b.id);const date=document.createElement('div');date.className='booking-date';date.textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(b.starts_at));row.append(code,date,at);root.append(row)}
 if(!current.length){const empty=document.createElement('p');empty.className='hint';empty.textContent='Nessun appuntamento oggi';root.append(empty)}showOffer()}
function fitWebsiteTitle(){
 const title=document.querySelector('#offer .offer-title.is-website');
 if(!title)return;
 // Calcola lo spazio disponibile nell'offerta senza modificare i dati salvati.
 const available=Math.max(160,$('offer').clientWidth-8);
 title.style.fontSize='';
 let font=parseFloat(getComputedStyle(title).fontSize)||48;
 title.style.fontSize=font+'px';
 while(title.scrollWidth>available && font>14){font-=1;title.style.fontSize=font+'px'}
}
function showOffer(){const offers=settings().offers.filter(x=>x&&typeof x==='object');const arr=offers.length?offers:DEFAULT_OFFERS;const o=arr[slide%arr.length];const box=$('offer');box.replaceChildren();for(const [cl,value] of [['offer-kicker',o.tag],['offer-title',o.title],['offer-detail',o.detail]]){const x=document.createElement('div');x.className=cl;x.textContent=String(value||'');if(cl==='offer-title' && /^(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+\/?$/i.test(x.textContent.trim()))x.classList.add('is-website');box.append(x)}fitWebsiteTitle()}
function clock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}).format(now);$('date').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now)}
async function refresh(){if(busy)return;busy=true;try{bookings=await fetchBookings();draw()}catch(e){bookings=[];draw();console.warn('Schermo clienti:',e.message)}finally{busy=false}}
window.addEventListener('resize',fitWebsiteTitle);window.addEventListener('storage',e=>{if(e.key===DISPLAY_KEY)draw();if(e.key===SESSION_KEY)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});clock();draw();refresh();setInterval(clock,1000);setInterval(()=>{slide++;showOffer()},9000);setInterval(refresh,30000);

let lastWelcomeEvent = 0;
let welcomeTimer = null;

async function checkWelcome() {
  try {
    const access = await token();
    const response = await fetch(
      SB_URL + '/functions/v1/vertex-screen-welcome',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + access
        },
        body: JSON.stringify({ action: 'latest' }),
        cache: 'no-store'
      }
    );

    if (!response.ok) return;
    const data = await response.json();
    const event = data.event;
    if (!event || Number(event.id) <= lastWelcomeEvent) return;

    lastWelcomeEvent = Number(event.id);
    if (Date.now() - new Date(event.created_at).getTime() > 15000) return;

    const code = String(event.booking_code || '');
    if (!/^A[0-9]{4}$/.test(code)) return;

    let screen = document.getElementById('vertex-welcome');
    if (!screen) {
      screen = document.createElement('div');
      screen.id = 'vertex-welcome';
      screen.style.cssText =
        'position:fixed;inset:0;z-index:99999;background:#07172b;' +
        'color:white;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;text-align:center;' +
        'gap:24px;font-family:Arial,sans-serif;padding:20px;';
      document.body.appendChild(screen);
    }

    screen.replaceChildren();

    for (const [value, size, color] of [
      ['✂ VERTEX HAMMAMI', 'clamp(22px,3vw,48px)', '#e6bb6a'],
      ['BENVENUTO!', 'clamp(44px,8vw,120px)', '#ffffff'],
      ['Siamo felici di averti qui.', 'clamp(20px,3vw,42px)', '#ffffff'],
      [code, 'clamp(60px,10vw,150px)', '#e6bb6a'],
      ['Accomodati, saremo subito da te.', 'clamp(18px,3vw,40px)', '#ffffff']
    ]) {
      const line = document.createElement('div');
      line.textContent = value;
      line.style.fontSize = size;
      line.style.color = color;
      line.style.fontWeight = 'bold';
      screen.appendChild(line);
    }

    clearTimeout(welcomeTimer);
    welcomeTimer = setTimeout(() => screen.remove(), 10000);
  } catch (e) {
    console.warn('Welcome TV:', e);
  }
}

checkWelcome();
setInterval(checkWelcome, 3000);

// La modalità a schermo intero richiede sempre un clic dell'operatore.
// Wake Lock è un supporto opzionale: le impostazioni di Windows restano necessarie.
let vertexWakeLock=null;
async function vertexKeepAwake(){
 if(!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
 try{if(!vertexWakeLock)vertexWakeLock=await navigator.wakeLock.request('screen');vertexWakeLock.addEventListener('release',()=>{vertexWakeLock=null},{once:true})}catch(e){console.info('Wake Lock non disponibile:',e.message)}
}
function vertexFullscreenLabel(){
 const btn=$('fullscreenBtn');if(!btn)return;
 btn.textContent=document.fullscreenElement?'⤢ Esci da schermo intero':'⛶ Schermo intero';
 btn.setAttribute('aria-label',document.fullscreenElement?'Esci da schermo intero':'Attiva schermo intero');
}
$('fullscreenBtn').addEventListener('click',async()=>{
 try{
  if(document.fullscreenElement){await document.exitFullscreen()}
  else {await document.documentElement.requestFullscreen();vertexKeepAwake()}
 }catch(e){console.warn('Schermo intero non disponibile: usare F11.',e)}
 vertexFullscreenLabel();
});
document.addEventListener('fullscreenchange',vertexFullscreenLabel);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&document.fullscreenElement)vertexKeepAwake()});
</script></body></html>
