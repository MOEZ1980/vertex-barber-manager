<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>VERTEX HAMMAMI — Schermo clienti</title>
<style>
:root{--gold:#e8c075;--line:#67502c;--bg:#080808;--panel:#171717}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:#f9f5ed;font-family:Arial,'Segoe UI',sans-serif;overflow:hidden}.screen{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:2.3vh 2.4vw;gap:2vh;background:radial-gradient(ellipse at 50% -15%,#33240e55,transparent 60%),#080808}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:2vh;gap:2vw}.brand{font-size:clamp(25px,3.8vw,78px);letter-spacing:.04em;color:var(--gold);font-weight:850;white-space:nowrap}.brand small{font-size:.38em;letter-spacing:.20em;display:block;text-align:center;margin-top:.5vh;color:#fff4d8}.time{text-align:right;white-space:nowrap}.clock{font-size:clamp(30px,4.5vw,88px);font-weight:800}.date{font-size:clamp(13px,1.45vw,28px);color:#d6c4a1}.body{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,.9fr);gap:2vw;min-height:0}.panel{border:1.5px solid var(--line);background:#141414;border-radius:1.3vw;padding:2vw;min-height:0;display:flex;flex-direction:column;box-shadow:0 8px 28px #0006}.heading{color:var(--gold);font-size:clamp(20px,2.55vw,50px);font-weight:800;margin:0 0 2vh}.hint{color:#cfc4b2;font-size:clamp(12px,1.18vw,25px);line-height:1.4}.rows{display:flex;flex-direction:column;gap:1.15vh;margin-top:2vh;overflow:hidden}.appointment{background:#24201a;border:1px solid #58492d;border-radius:12px;display:grid;grid-template-columns:minmax(80px,27%) 1fr;gap:1vw;align-items:center;padding:1.6vh 1.25vw}.appointment .at{color:var(--gold);font-weight:bold;font-size:clamp(23px,3vw,60px)}.appointment .code{font-size:clamp(20px,2.5vw,50px);font-weight:750}.appointment small{display:block;color:#c7bea9;font-size:clamp(12px,1.15vw,23px);margin-top:.7vh}.offer{display:flex;flex:1;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:2vh;animation:fade .5s ease}.offer-kicker{color:var(--gold);font-size:clamp(15px,1.6vw,33px);letter-spacing:.08em;font-weight:bold}.offer-title{font-weight:850;line-height:1.1;font-size:clamp(32px,4.4vw,90px);overflow-wrap:anywhere}.offer-detail{font-size:clamp(19px,2vw,40px);line-height:1.35;color:#ebd3a1;max-width:95%}@keyframes fade{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}.footer{border-top:2px solid var(--line);padding-top:1.3vh;display:flex;align-items:center;justify-content:space-between;gap:2vw;font-size:clamp(16px,1.6vw,34px);color:#e5cf9e;font-weight:650}.demo{position:fixed;right:1.6vw;bottom:5.5vh;background:#533f1d;color:#ffe7af;border:1px solid #c7a256;border-radius:8px;padding:.3em .65em;font-size:clamp(11px,.95vw,19px);letter-spacing:.05em} @media(max-aspect-ratio:1){.screen{padding:1.5vh 2vw}.body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.brand{white-space:normal}.panel{padding:1.4vh 3vw}.rows{display:grid;grid-template-columns:1fr 1fr}.appointment{padding:.6vh 1.2vw}.appointment .at{font-size:2.6vh}.appointment .code{font-size:2vh}.appointment small{font-size:1.2vh}.heading{font-size:2.5vh;margin-bottom:.5vh}.offer-title{font-size:4vh}.offer-detail{font-size:2vh}}

/* Pulsante indietro per l'app su telefono */
.vertex-back{position:fixed;z-index:9999;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#e8c075;color:#14100a;border:2px solid #70552e;border-radius:12px;padding:13px 18px;font:700 16px Arial,sans-serif;text-decoration:none;box-shadow:0 5px 20px #000b;touch-action:manipulation}
.vertex-back:focus-visible{outline:3px solid white}
@media(min-width:900px){.vertex-back{display:none}}
</style></head>
<body><a class="vertex-back" href="/index.html" aria-label="Torna all’Admin">← Torna all’Admin</a><div class="screen"><header class="head"><div class="brand">✂ VERTEX HAMMAMI <small>BENVENUTI NEL NOSTRO BARBER SHOP</small></div><div class="time"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></header><main class="body"><section class="panel"><h2 class="heading">APPUNTAMENTI DI OGGI</h2><div class="hint">Nome (solo con consenso), codice, data e ora · Nessun numero di telefono</div><div class="rows" id="appointments"></div></section><section class="panel"><h2 class="heading">NOVITÀ &amp; OFFERTE</h2><div id="offer" class="offer" aria-live="polite"></div></section></main><footer class="footer"><span>Via Terraglio 111 · Frescada, Preganziol</span><span>PRENOTA SU www.vertexhammami.it</span></footer></div><div class="demo" id="modeLabel">ACCESSO ADMIN RICHIESTO</div>
<script>
'use strict';
// Pagina autenticata. Deve essere ospitata sullo STESSO dominio dell'Admin.
// Nessun numero di telefono viene mostrato o salvato in questa pagina.
const SB_URL='https://xdyrujptrggyhltljmlm.supabase.co';
const SB_KEY='sb_publishable_PJLP34HkqWKZbwhsN65KKA_12wdK7V8';
const SESSION_KEY='vertex_royal_gold_auth_v1';
const DISPLAY_KEY='vertex_schermo_live_settings_v1';
const DEFAULT_OFFERS=[
 {tag:'BENVENUTI',title:'VERTEX HAMMAMI',detail:'Il tuo stile, la nostra passione.'},
 {tag:'PRENOTA ONLINE',title:'WWW.VERTEXHAMMAMI.IT',detail:'Prenota il tuo appuntamento online.'},
 {tag:'NOVITÀ',title:'LE NOSTRE OFFERTE',detail:'Chiedi in negozio le promozioni disponibili.'}
];
const $=id=>document.getElementById(id);
function settings(){try{const x=JSON.parse(localStorage.getItem(DISPLAY_KEY)||'null');if(x&&Array.isArray(x.offers))return x}catch{}return {offers:DEFAULT_OFFERS,consents:{}}}
function romeParts(value){let o={};for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value))){if(x.type!=='literal')o[x.type]=x.value}return {date:`${o.year}-${o.month}-${o.day}`,hour:`${o.hour}:${o.minute}`,short:`${o.day}/${o.month}`}}
function today(){return romeParts(Date.now()).date}
function bookingCode(id){let h=2166136261;for(const c of String(id)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'A'+String((h>>>0)%10000).padStart(4,'0')}
function bookingName(raw){const first=String(raw||'').trim().split(/\s+/)[0]||'';return first.replace(/[^\p{L}'-]/gu,'').slice(0,26)}
function isBlock(b){return b.status==='blocked'||String(b.customer_name||'').trim().toUpperCase()==='BLOCCATO'||/^pausa(?:\b|\s|·)/i.test(b.service_name||'')}
function session(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');return s?.refresh_token?s:null}catch{return null}}
async function token(){let s=session();if(!s)throw Error('Accedi prima all’Admin in questo browser.');if(Number(s.expires_at||0)>Date.now()+90000&&s.access_token)return s.access_token;
 const res=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});
 const x=await res.json();if(!res.ok||!x.access_token)throw Error('Sessione scaduta: effettua di nuovo il login nell’Admin.');
 s={access_token:x.access_token,refresh_token:x.refresh_token,expires_at:Date.now()+Number(x.expires_in||3600)*1000};localStorage.setItem(SESSION_KEY,JSON.stringify(s));return s.access_token}
async function fetchBookings(){const access=await token();const res=await fetch(SB_URL+'/functions/v1/admin-bookings',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+access},body:JSON.stringify({action:'list'}),cache:'no-store'});const body=await res.json().catch(()=>({}));if(!res.ok||body?.error)throw Error('Accesso ai dati non disponibile. Riapri l’Admin.');const rows=Array.isArray(body)?body:Array.isArray(body.bookings)?body.bookings:body.data;if(!Array.isArray(rows))throw Error('Risposta prenotazioni non valida');return rows}
let bookings=[],slide=0,busy=false;
function draw(){const opt=settings();const d=today();let current=bookings.filter(x=>x.status==='confirmed'&&!isBlock(x)&&x.starts_at&&romeParts(x.starts_at).date===d).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).slice(0,5);
 const root=$('appointments');root.replaceChildren();for(const b of current){const row=document.createElement('div');row.className='appointment';const when=romeParts(b.starts_at);const at=document.createElement('div');at.className='at';at.textContent=when.hour;const info=document.createElement('div');const code=document.createElement('div');code.className='code';const name=opt.consents?.[String(b.id)]===true?bookingName(b.customer_name):'';code.textContent=(name?name+' · ':'')+bookingCode(b.id);const detail=document.createElement('small');detail.textContent=when.short+' · '+String(b.service_name||'Appuntamento').slice(0,50);info.append(code,detail);row.append(at,info);root.append(row)}
 if(!current.length){const empty=document.createElement('p');empty.className='hint';empty.textContent='Nessun appuntamento confermato per oggi';root.append(empty)}showOffer()}
function showOffer(){const offers=settings().offers.filter(x=>x&&typeof x==='object');const arr=offers.length?offers:DEFAULT_OFFERS;const o=arr[slide%arr.length];const box=$('offer');box.replaceChildren();for(const [cl,value] of [['offer-kicker',o.tag],['offer-title',o.title],['offer-detail',o.detail]]){const x=document.createElement('div');x.className=cl;x.textContent=String(value||'');box.append(x)}}
function clock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}).format(now);$('date').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now)}
async function refresh(){if(busy)return;busy=true;try{bookings=await fetchBookings();$('modeLabel').textContent='PRENOTAZIONI CONFERMATE · AGGIORNAMENTO AUTOMATICO';draw()}catch(e){bookings=[];draw();$('modeLabel').textContent='NON CONNESSO · '+e.message}finally{busy=false}}
window.addEventListener('storage',e=>{if(e.key===DISPLAY_KEY)draw();if(e.key===SESSION_KEY)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});clock();draw();refresh();setInterval(clock,1000);setInterval(()=>{slide++;showOffer()},9000);setInterval(refresh,30000);
</script></body></html>
